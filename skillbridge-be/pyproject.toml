[tool.poetry]
name = "skillbridge-be"
version = "0.1.0"
description = "SkillBridge Backend Project"
authors = ["anishbade"]
license = "MIT"
readme = "README.md"

# This is the critical line for your imports
packages = [
    { include = "skillbridge", from = "src" }
]

[tool.poetry.dependencies]
torch = [
    { version = "^2.14.0", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "^2.14.0", markers = "sys_platform == 'darwin'" },
]
python = ">=3.11,<4.0"
passlib = ">=1.7.4,<2.0.0"
bcrypt = ">=5.0.0,<6.0.0"
python-jose = ">=3.5.0,<4.0.0"
email-validator = ">=2.3.0,<3.0.0"
python-multipart = ">=0.0.29,<0.0.30"
pydantic-settings = ">=2.14.1,<3.0.0"
fastapi = ">=0.136.3,<0.137.0"
uvicorn = ">=0.48.0,<0.49.0"
databases = ">=0.9.0,<0.10.0"
asyncpg = ">=0.31.0,<0.32.0"
sqlalchemy = ">=2.0.49,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
pydantic = ">=2.13.4,<3.0.0"
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
black = ">=26.5.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
mypy = ">=2.1.0,<3.0.0"
pre-commit = ">=4.6.0,<5.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
jinja2 = ">=3.1.6,<4.0.0"
pymysql = "^1.2.0"
aiomysql = "^0.3.2"
aiosqlite = "^0.22.1"
pytz = "^2026.2"
loguru = "^0.7.3"
greenlet = "^3.5.1"
cryptography = "^48.0.0"
boto3 = "^1.43.28"
websockets = "^16.0"
jwt = "^1.4.0"
openai = "^3.14.1"
detoxify = "^0.5.2"

[tool.poetry.group.dev.dependencies]
black = ">=26.5.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
pylint = ">=4.0.5,<5.0.0"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"