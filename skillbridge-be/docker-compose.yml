
networks:
  my_network:
    driver: bridge

services:
  app:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENV=deployment
      # 3307 is the host-side port; containers use MySQL's internal port.
      - MYSQL_HOSTNAME=skillbridge-mysql
      - MYSQL_PORT=3306
      - PYTHONPATH=/app/src  # ← Add this for safety
    networks:
      - my_network
    # Optional: Add healthcheck
    healthcheck:
      # Exercise a database-backed public endpoint, not only the process root.
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/role/roles/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      skillbridge-mysql:
        condition: service_healthy
  
  skillbridge-mysql:
    image: mysql:8.0
    container_name: skillbridge-mysql
    restart: always
    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - skillbridge-mysql:/var/lib/mysql

    env_file:
      - .env

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

    networks:
      - my_network


volumes:
  skillbridge-mysql:
