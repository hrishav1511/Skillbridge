  <div class="auth-page">

    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3v18M5 5l14 14M19 5L5 19"></path>
        </svg>
      </span>
      <span class="brand-name">SkillBridge</span>
    </div>

    <section class="auth-card" aria-labelledby="auth-title">
      <header class="auth-header">
        <h1 id="auth-title">Welcome Back!</h1>
        <p> Please enter your Admin credentials</p>
      </header>

      <form class="auth-form" novalidate [formGroup]="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="Enter your Email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter Password" autocomplete="current-password" />
            <button type="button" class="icon-button" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword" aria-controls="password">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 4.22-5.06"></path>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-3.17 4.19"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" />
            <span class="box" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="button" (click)="gotodashboard()" class="btn btn-primary">Sign in</button>

      </form>
    </section>
  </div>
