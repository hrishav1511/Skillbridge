<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hrishav Banik</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
     * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: linear-gradient(135deg, #9da6f9, #fefdff);
  color: white;
}

/* Full page container */
.container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* Main layout */
.content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1000px;
  width: 100%;
  gap: 50px;
  background: #9ec6e9;
  border-radius: 10px;
  padding: 10px;
}

/* Image */
.image-section img {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  object-fit: cover;

  border: 4px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

  transition: transform 0.3s ease;
}

.image-section img:hover {
  transform: scale(1.05);
}

/* Text */
.text-section h1 {
  font-size: 44px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.text-section h2 {
  font-size: 18px;
  font-weight: 300;
  margin-top: 8px;
  opacity: 0.85;
}

.text-section p {
  margin-top: 18px;
  font-size: 16px;
  line-height: 1.7;
  max-width: 480px;
  opacity: 0.9;
}

/* Button */
.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 10px 22px;
  border-radius: 25px;

  background: white;
  color: #6b4bb7;

  text-decoration: none;
  font-weight: 500;
  font-size: 14px;

  transition: all 0.25s ease;
}

.btn:hover {
  background: #f1f1f1;
  transform: translateY(-2px);
}

/* Mobile */
@media (max-width: 768px) {
  .content {
    flex-direction: column;
    text-align: center;
    gap: 30px;
  }

  .image-section img {
    width: 200px;
    height: 200px;
  }

  .text-section h1 {
    font-size: 32px;
  }

  .text-section p {
    font-size: 15px;
  }
}
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <div class="image-section">
          <img
            src="https://media.licdn.com/dms/image/v2/D4D03AQHbxOv6Q37K1A/profile-displayphoto-scale_400_400/B4DZjS7Wg_HsAg-/0/1755885433603?e=1778716800&v=beta&t=ADIqXq7zONnRdQp2Q6Teb9Mh7g3cKcqeAoS9kO7E5Ms"
            alt="Anish Bade"
          />
        </div>

        <div class="text-section">
          <h1>Hrishav Banik</h1>
          <h2>Team 2</h2>

          <p>
            Hello! I am Hrishav Banik,a Master’s student in Global
            Software Development at Fulda University of Applied Sciences. I
            am passionate about building scalable web systems, working with modern web
            technologies.
          </p>

          <a href="mailto:hrishav.banik@informatik.hs-fulda.de" class="btn"
            >Contact Me</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
