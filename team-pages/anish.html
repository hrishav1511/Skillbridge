<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anish Bade</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      /* Full page container */
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px;
      }

      .content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1000px;
        width: 100%;
        gap: 60px;
      }

      /* Image section */
      .image-section img {
        width: 320px;
        height: 320px;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      /* Text section */
      .text-section h1 {
        font-size: 48px;
        font-weight: 600;
      }

      .text-section h2 {
        font-size: 20px;
        font-weight: 300;
        margin-top: 10px;
        opacity: 0.9;
      }

      .text-section p {
        margin-top: 20px;
        font-size: 18px;
        line-height: 1.6;
        max-width: 500px;
        opacity: 0.9;
      }

      .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 24px;
        border-radius: 30px;
        background: white;
        color: #764ba2;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn:hover {
        background: #f0f0f0;
      }

      /* Mobile responsive */
      @media (max-width: 768px) {
        .content {
          flex-direction: column;
          text-align: center;
        }

        .image-section img {
          width: 220px;
          height: 220px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <div class="image-section">
          <img
            src="https://raw.githubusercontent.com/anish-hsf/my-profile/de249c4191ecf665f62508dc7dc29872bab98144/20241107_105104.jpg"
            alt="Anish Bade"
          />
        </div>

        <div class="text-section">
          <h1>Anish Bade</h1>
          <h2>Team 2</h2>

          <p>
            Hello! I am Anish Bade, currently pursuing a Master’s in Global
            Software Development at Fulda University of Applied Sciences. I
            enjoy building scalable web systems, working with modern web
            technologies.
          </p>

          <a href="mailto:anish.bade@informatik.hs-fulda.de" class="btn"
            >Contact Me</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
