name: Stop AWS EC2 Instance

on:
  workflow_dispatch:
    inputs:
      confirm_stop:
        description: "Type STOP to pause the EC2 instance"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EC2_INSTANCE_NAME: skillbridge-about-page-server

jobs:
  stop:
    name: Stop EC2 instance
    runs-on: ubuntu-latest

    steps:
      - name: Stop if confirmation is wrong
        if: ${{ inputs.confirm_stop != 'STOP' }}
        run: |
          echo "You must type STOP to confirm EC2 stop."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find EC2 instance by name
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${EC2_INSTANCE_NAME}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "No EC2 instance found with name: ${EC2_INSTANCE_NAME}"
            echo "INSTANCE_ID=" >> "$GITHUB_ENV"
          else
            echo "Found EC2 instance: ${INSTANCE_ID}"
            echo "INSTANCE_ID=${INSTANCE_ID}" >> "$GITHUB_ENV"
          fi

      - name: Stop if no EC2 instance exists
        if: ${{ env.INSTANCE_ID == '' }}
        run: |
          echo "Nothing to stop."
          exit 0

      - name: Check current EC2 state
        if: ${{ env.INSTANCE_ID != '' }}
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "STATE=${STATE}" >> "$GITHUB_ENV"
          echo "Current state: ${STATE}"

      - name: Stop EC2 instance
        if: ${{ env.INSTANCE_ID != '' && env.STATE == 'running' }}
        run: |
          aws ec2 stop-instances \
            --instance-ids "${INSTANCE_ID}"

      - name: Wait until EC2 instance is stopped
        if: ${{ env.INSTANCE_ID != '' && env.STATE == 'running' }}
        run: |
          aws ec2 wait instance-stopped \
            --instance-ids "${INSTANCE_ID}"

      - name: Print result
        if: ${{ env.INSTANCE_ID != '' }}
        run: |
          echo "EC2 instance is stopped or stopping."
          echo "Instance ID: ${INSTANCE_ID}"
          echo "Instance name: ${EC2_INSTANCE_NAME}"
