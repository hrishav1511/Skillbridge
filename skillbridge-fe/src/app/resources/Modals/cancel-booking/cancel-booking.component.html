<div class="cancel-dialog" role="dialog" aria-modal="true" aria-labelledby="cancel-booking-title">
  <header class="cancel-dialog__header">
    <div class="cancel-dialog__icon" aria-hidden="true">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <div>
      <p class="cancel-dialog__eyebrow">Booking action</p>
      <h2 id="cancel-booking-title">Cancel this booking?</h2>
    </div>
    <button type="button" class="cancel-dialog__close" (click)="close()" [disabled]="cancelling" aria-label="Close cancellation dialog">
      <i class="bi bi-x-lg"></i>
    </button>
  </header>

  <div class="cancel-dialog__body">
    <p class="cancel-dialog__message">Your booking will be cancelled and the money will be transferred back to your account in <strong>1-2 business days</strong>.</p>

    <label class="cancel-dialog__label" for="cancellation-reason">Reason for cancellation <span>(optional)</span></label>
    <textarea
      id="cancellation-reason"
      [(ngModel)]="reason"
      rows="4"
      placeholder="Tell us why you are cancelling this booking..."
      [disabled]="cancelling"></textarea>
  </div>

  <footer class="cancel-dialog__footer">
    <button type="button" class="cancel-dialog__back" (click)="close()" [disabled]="cancelling">Keep booking</button>
    <button type="button" class="cancel-dialog__confirm" (click)="confirmCancellation()" [disabled]="cancelling">
      <i class="bi" [class.bi-arrow-repeat]="cancelling" [class.bi-x-circle]="!cancelling"></i>
      {{ cancelling ? 'Cancelling...' : 'Confirm cancellation' }}
    </button>
  </footer>
</div>
