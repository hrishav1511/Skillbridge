<div class="flex min-h-screen flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="assets/newlogo.png" alt="Your Company" class="mx-auto h-16 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white">Sign in to your account</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <div class="rounded-2xl bg-white/10 backdrop-blur-md px-6 py-8 ">
      <form [formGroup]="loginForm" class="space-y-6">
        <div class="mb-6">
          <div class="grid grid-cols-2 rounded-xl bg-white/5 p-1">

            <button type="button" (click)="selectedRole = 'student'"
              class="flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-all" [ngClass]="{
        'bg-blue-500 text-white shadow': selectedRole === 'student',
        'text-slate-300 hover:bg-white/10': selectedRole !== 'student'
      }">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
</svg> Student
            </button>

            <button type="button" (click)="selectedRole = 'tutor'"
              class="flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-all" [ngClass]="{
        'bg-blue-500 text-white shadow': selectedRole === 'tutor',
        'text-slate-300 hover:bg-white/10': selectedRole !== 'tutor'
      }">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
</svg>
 Tutor
            </button>

          </div>
        </div>
        <div>
          <label for="email" class="block text-sm/6 font-medium text-white">Email address</label>
          <div class="mt-2">
            <input id="email" formControlName="email" type="email" name="email" required autocomplete="email"
              class="block w-full rounded-lg bg-white/10 backdrop-blur-sm px-3 py-1.5 text-base text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-blue-300/30 sm:text-sm/6" />
             <div
    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
    class="mt-1 text-sm text-red-300"
  >
    <span *ngIf="loginForm.get('email')?.errors?.['required']">
      Email is required.
    </span>

    <span *ngIf="loginForm.get('email')?.errors?.['email']">
      Please enter a valid email address.
    </span>
    <span *ngIf="loginForm.get('email')?.errors?.['pattern']">
                  Only official hochschule fulda email addresses are allowed.
                </span>
  </div>
            </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm/6 font-medium text-white">Password</label>
            <div class="text-sm">
              <a href="#" class="font-semibold text-blue-300 hover:text-blue-200"
                [routerLink]="['/auth/password-reset']">Forgot password?</a>
            </div>
          </div>
          <div class="mt-2">
            <div class="relative">
              <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'"
                name="password" required autocomplete="current-password"
                class="block w-full rounded-lg bg-white/10 backdrop-blur-sm px-3 py-1.5 pr-10 text-base text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-blue-300/30 sm:text-sm/6" />
              <button type="button" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword" aria-controls="password"
                class="absolute inset-y-0 right-0 flex items-center px-3 text-white/60 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-300/30 rounded-r-lg">
                <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 4.22-5.06"></path>
                  <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-3.17 4.19"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div
    *ngIf="
      loginForm.get('password')?.touched &&
      loginForm.get('password')?.invalid
    "
    class="mt-1 text-sm text-red-300"
  >
    <span *ngIf="loginForm.get('password')?.errors?.['required']">
      Password is required.
    </span>

    <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
      Password must be at least 8 characters.
    </span>
    
  </div>
            </div>
        </div>

        <div class="d-flex gap-1">
          <button type="button" (click)="onSubmit()"
            class="flex w-full justify-center rounded-lg bg-blue-500 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-blue-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Sign
            in</button>
          <!-- <button type="button" class="flex w-half justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Sign in as teacher</button> -->
        </div>
      </form>

      <p class="mt-10 text-center text-sm/6 text-white/70">
        Don't have an account?
        <a href="#" class="font-semibold text-blue-300 hover:text-blue-200" [routerLink]="['/auth/sign-up']">Sign up</a>
      </p>
      <p class="mt-4 text-center text-sm/6 text-white/70">
        Not a student?
        <button type="button" class="font-semibold text-blue-300 hover:text-blue-200" (click)="continueAsGuest()">Visit as a
          guest</button>
      </p>
    </div>
  </div>
</div>
